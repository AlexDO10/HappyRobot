# Fly.io deployment config. The app speaks plain HTTP on $PORT inside the
# container; Fly terminates TLS and forwards via the [http_service] below.
# Rename "app" before first deploy, or run `fly launch` to generate it.
app = "happyrobot-carrier-sales-ado"
primary_region = "dfw"  # Dallas (qro/Querétaro is deprecated on Fly)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  FMCSA_MODE = "mock"
  # SQLite analytics DB lives on the mounted volume (persists across deploys).
  CALLS_DB = "/data/calls.db"

# Secrets (NOT baked into the image) are set with:
#   fly secrets set API_KEY=... FMCSA_WEBKEY=... DASHBOARD_ORIGINS=...

# Persistent volume for the call-results SQLite DB. Create it once with:
#   fly volumes create carrier_data --region dfw --size 1
[mounts]
  source = "carrier_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  # Single machine: SQLite is local to one volume, so we keep one writer to
  # avoid split analytics across machines. Scale the read path later via a
  # shared DB (Postgres) if needed.
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "2s"
